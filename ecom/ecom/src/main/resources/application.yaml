spring:
  application:
    name: ecom

  datasource:
    url: jdbc:postgresql://localhost:5432/ecom_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXYtb25seS0xMjM0NTY3ODkwYWJjZGVmZ2hpams=
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

app:
  cors:
    allowed-origins: http://localhost:5173
  docs-public: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

firebase:
  credentials-path: D:/Collections/ecom/ecom/firebase.json